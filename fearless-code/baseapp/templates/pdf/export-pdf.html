<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat PDF Export</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; }
        .message { margin-bottom: 10px; padding: 10px; }
        .timestamp { font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <h2>Chat Room </h2>

    {% for message in messages %}
        <div class="message">
            {% if message.prompt %}
                <strong>Prompt:</strong> {{ message.prompt }}<br>
            {% endif %}
            {% if message.response %}
                <strong>Response:</strong> {{ message.response }}<br>
            {% endif %}
            <div class="timestamp">Date: {{ message.created_at }}</div>
        </div>
    {% endfor %}

</body>
</html>
